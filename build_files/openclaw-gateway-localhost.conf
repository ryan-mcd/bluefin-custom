[Service]
# OpenClaw's upstream defaults can change. Keep the intended local-only bind in
# the user service environment and verify with `ujust ai-doctor` after onboarding.
Environment=HOST=127.0.0.1
Environment=OPENCLAW_HOST=127.0.0.1
Environment=OPENCLAW_GATEWAY_HOST=127.0.0.1
Environment=OPENCLAW_GATEWAY_PORT=18789
