[bluefin-agent-ubuntu]
image=quay.io/toolbx/ubuntu-toolbox:24.04
pull=true
root=false
replace=false
start_now=false
init=false
additional_packages="bash-completion build-essential ca-certificates clang cmake curl ffmpeg file git git-lfs gnupg jq less lsb-release make openssh-client pkg-config python3 python3-pip python3-venv ripgrep rsync shellcheck sudo tmux unzip xz-utils"
additional_packages="clinfo mesa-utils pciutils vainfo vulkan-tools"
additional_packages="fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation fonts-noto-color-emoji fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libegl1 libfontconfig1 libfreetype6 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libwayland-client0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 xfonts-cyrillic xfonts-scalable xvfb"
init_hooks="/run/host/usr/bin/bluefin-agent-ubuntu-setup --container-init;"
exported_bins="/usr/local/bin/agent-node"
exported_bins="/usr/local/bin/agent-npm"
exported_bins="/usr/local/bin/agent-npx"
exported_bins="/usr/local/bin/agent-openclaw"
exported_bins="/usr/local/bin/agent-hermes"
