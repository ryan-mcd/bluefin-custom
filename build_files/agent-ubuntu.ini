[bluefin-agent-ubuntu]
image=quay.io/toolbx/ubuntu-toolbox:24.04
pull=true
root=false
replace=false
start_now=false
init=false
additional_packages="bash-completion build-essential ca-certificates clang cmake curl file git git-lfs gnupg jq less lsb-release make openssh-client pkg-config python3 python3-pip python3-venv ripgrep rsync shellcheck sudo tmux unzip xz-utils"
additional_packages="clinfo mesa-utils pciutils vainfo vulkan-tools"
init_hooks="/run/host/usr/bin/bluefin-agent-ubuntu-setup --container-init;"
exported_bins="/usr/local/bin/agent-node"
exported_bins="/usr/local/bin/agent-npm"
exported_bins="/usr/local/bin/agent-npx"
exported_bins="/usr/local/bin/agent-openclaw"
